<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕷️ SPIDER TRAINING SYSTEM</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111118;
            --border: #1a1a2e;
            --text: #c8c8d4;
            --text-bright: #e8e8f0;
            --accent: #7b2fff;
            --accent-glow: #9b4fff;
            --neon-blue: #00d4ff;
            --neon-pink: #ff2d78;
            --danger: #ff3860;
            --success: #23d160;
            --warning: #ffdd57;
            --grid-color: rgba(123, 47, 255, 0.08);
            --scanline: rgba(0, 212, 255, 0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', 'Source Code Pro', 'Consolas', monospace;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: crosshair;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* 背景城市天際線 */
        .cityscape {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
            background:
                linear-gradient(to top, rgba(123, 47, 255, 0.1) 0%, transparent 100%),
                repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    var(--scanline) 2px,
                    var(--scanline) 4px);
        }
        .cityscape::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(180deg, transparent 20%, #0d0d1a 20%) 0 0 / 30px 100%,
                linear-gradient(180deg, transparent 35%, #0d0d1a 35%) 40px 0 / 25px 100%,
                linear-gradient(180deg, transparent 15%, #0d0d1a 15%) 80px 0 / 35px 100%,
                linear-gradient(180deg, transparent 40%, #0d0d1a 40%) 130px 0 / 20px 100%,
                linear-gradient(180deg, transparent 25%, #0d0d1a 25%) 170px 0 / 40px 100%,
                linear-gradient(180deg, transparent 30%, #0d0d1a 30%) 230px 0 / 28px 100%,
                linear-gradient(180deg, transparent 18%, #0d0d1a 18%) 280px 0 / 32px 100%,
                linear-gradient(180deg, transparent 38%, #0d0d1a 38%) 330px 0 / 22px 100%,
                linear-gradient(180deg, transparent 22%, #0d0d1a 22%) 370px 0 / 38px 100%,
                linear-gradient(180deg, transparent 28%, #0d0d1a 28%) 430px 0 / 26px 100%;
            background-repeat: repeat-x;
            background-position: bottom;
            background-size: 500px 100%;
            animation: cityScroll 60s linear infinite;
        }
        @keyframes cityScroll {
            from { background-position: 0 bottom; }
            to { background-position: -500px bottom; }
        }

        /* 粒子系統 */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            background: var(--accent-glow);
            border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0;
        }
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(100vh) scale(0); }
            10% { opacity: 0.8; }
            90% { opacity: 0.3; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1.5); }
        }

        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 10;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 標題 */
        .title-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .title-main {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: bold;
            color: var(--text-bright);
            letter-spacing: 3px;
            text-shadow: 0 0 30px var(--accent-glow), 0 0 60px var(--accent);
            animation: titlePulse 3s ease-in-out infinite;
            position: relative;
            display: inline-block;
        }
        @keyframes titlePulse {
            0%, 100% { text-shadow: 0 0 30px var(--accent-glow), 0 0 60px var(--accent); }
            50% { text-shadow: 0 0 50px var(--accent-glow), 0 0 100px var(--accent), 0 0 150px var(--neon-blue); }
        }
        .title-sub {
            font-size: 0.85rem;
            color: var(--neon-blue);
            letter-spacing: 5px;
            margin-top: 5px;
            opacity: 0.8;
        }
        .spider-icon {
            font-size: 3rem;
            display: block;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* 卡片 */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
            transition: left 0.6s ease;
        }
        .card:hover::before {
            left: 100%;
        }
        .card:hover {
            border-color: var(--accent);
            box-shadow: 0 8px 35px rgba(123, 47, 255, 0.3);
            transform: translateY(-2px);
            background: #151520;
        }
        .card:active {
            transform: scale(0.98);
            transition: transform 0.1s ease;
        }
        .card.selected {
            border-color: var(--accent-glow);
            box-shadow: 0 0 30px rgba(123, 47, 255, 0.5), inset 0 0 30px rgba(123, 47, 255, 0.05);
            background: #1a1a2e;
            animation: selectedGlow 1.5s ease-in-out infinite;
        }
        @keyframes selectedGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(123, 47, 255, 0.5); }
            50% { box-shadow: 0 0 50px rgba(155, 79, 255, 0.8); }
        }

        /* 像素風圖示容器 */
        .card-icon {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background: linear-gradient(135deg, rgba(123, 47, 255, 0.3), rgba(0, 212, 255, 0.1));
            border: 1px solid #7b2fff;
            clip-path: polygon(15% 0, 85% 0, 100% 15%, 100% 85%, 85% 100%, 15% 100%, 0 85%, 0 15%);
            margin-bottom: 8px;
            color: #fff;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-bright);
            letter-spacing: 1px;
        }
        .card-desc {
            font-size: 0.75rem;
            color: #888;
            margin-top: 4px;
        }

        /* 按鈕 */
        .btn {
            display: inline-block;
            padding: 14px 35px;
            font-size: 1rem;
            font-family: inherit;
            letter-spacing: 2px;
            border: 2px solid var(--accent);
            background: transparent;
            color: var(--accent-glow);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            font-weight: bold;
        }
        .btn:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 40px rgba(123, 47, 255, 0.6);
            text-shadow: 0 0 10px #fff;
        }
        .btn:active {
            transform: scale(0.95);
            transition: transform 0.1s ease;
        }
        .btn-large {
            font-size: 1.2rem;
            padding: 18px 50px;
            letter-spacing: 4px;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent-glow);
            box-shadow: 0 0 25px rgba(123, 47, 255, 0.4);
        }
        .btn-primary:hover {
            box-shadow: 0 0 50px rgba(155, 79, 255, 0.8);
        }

        /* 網格系統 */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
        }
        .grid-5 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        /* 時間選擇器 */
        .time-slider-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .time-chip {
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: #999;
            background: transparent;
            font-family: inherit;
        }
        .time-chip:hover {
            border-color: var(--accent);
            color: var(--accent-glow);
        }
        .time-chip.selected {
            border-color: var(--accent-glow);
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 20px rgba(123, 47, 255, 0.5);
            font-weight: bold;
        }

        /* 確認頁 */
        .config-display {
            background: #0a0a14;
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            box-shadow: inset 0 0 30px rgba(123, 47, 255, 0.08);
        }
        .config-line {
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin: 8px 0;
            color: var(--neon-blue);
        }
        .config-line span {
            color: var(--accent-glow);
            font-weight: bold;
        }
        .config-divider {
            border: none;
            border-top: 1px dashed var(--border);
            margin: 15px 0;
        }

        /* 進度指示器 */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--neon-blue));
            border-radius: 2px;
            transition: width 0.5s ease;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* 課表輸出 */
        .plan-output {
            background: #0a0a14;
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 40px rgba(123, 47, 255, 0.2);
        }
        .plan-header {
            text-align: center;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .plan-title {
            font-size: 1.3rem;
            color: var(--accent-glow);
            letter-spacing: 3px;
            text-shadow: 0 0 20px var(--accent);
        }
        .plan-meta {
            font-size: 0.75rem;
            color: var(--neon-blue);
            letter-spacing: 2px;
        }
        .exercise-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin: 6px 0;
            border-radius: 8px;
            background: rgba(123, 47, 255, 0.05);
            border-left: 3px solid var(--accent);
            transition: all 0.2s ease;
            font-size: 0.85rem;
        }
        .exercise-item:hover {
            background: rgba(123, 47, 255, 0.12);
            border-left-color: var(--neon-blue);
        }
        .exercise-number {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.75rem;
            flex-shrink: 0;
            margin-right: 12px;
        }
        .exercise-name {
            flex: 1;
            font-weight: bold;
            color: #ddd;
            letter-spacing: 1px;
        }
        .exercise-sets {
            color: var(--neon-blue);
            font-size: 0.75rem;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .section-label {
            color: var(--accent-glow);
            font-size: 0.85rem;
            letter-spacing: 3px;
            margin: 15px 0 8px;
            padding-left: 5px;
            border-bottom: 1px solid rgba(123, 47, 255, 0.2);
            padding-bottom: 5px;
        }

        /* 掃描線效果 */
        .scanline-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            opacity: 0.04;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0,0,0,0.5) 2px,
                    rgba(0,0,0,0.5) 4px);
        }

        /* 蜘蛛人容器 */
        .spider-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        /* CSS 像素蜘蛛人 */
        .spider-sprite {
            width: 70px;
            height: 100px;
            position: relative;
            animation: spiderIdle 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px #ff2d78);
            display: inline-block; /* 保持原有佈局 */
        }
        .spider-head {
            position: absolute;
            width: 45px;
            height: 35px;
            background: #d60000;
            border-radius: 50%;
            top: 0;
            left: 12px;
            border: 3px solid #111;
        }
        .spider-head::before,
        .spider-head::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 15px;
            background: white;
            top: 10px;
            border-radius: 50%;
        }
        .spider-head::before { left: 8px; }
        .spider-head::after { right: 8px; }
        .spider-body {
            position: absolute;
            width: 40px;
            height: 50px;
            background: linear-gradient(90deg, #111 45%, #d60000 45%);
            top: 32px;
            left: 15px;
            border-radius: 15px;
            border: 3px solid #111;
        }
        .spider-body::after {
            content: "✦";
            color: white;
            position: absolute;
            font-size: 25px;
            left: 8px;
            top: 10px;
        }
        .spider-leg {
            position: absolute;
            width: 45px;
            height: 5px;
            background: #111;
            top: 55px;
        }
        .spider-leg.left {
            left: -30px;
            transform: rotate(25deg);
        }
        .spider-leg.right {
            right: -30px;
            transform: rotate(-25deg);
        }

        /* 蜘蛛人動畫 */
        @keyframes spiderIdle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-8px) rotate(-3deg); }
            75% { transform: translateY(-4px) rotate(3deg); }
        }
        .spider-sprite.jump {
            animation: spiderJump 0.6s ease-out;
        }
        @keyframes spiderJump {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-60px) scale(1.2); }
            100% { transform: translateY(0) scale(1); }
        }
        .spider-sprite.swing {
            animation: spiderSwing 0.8s ease-in-out;
        }
        @keyframes spiderSwing {
            0% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-50px) rotate(-15deg); }
            75% { transform: translateX(50px) rotate(15deg); }
            100% { transform: translateX(0) rotate(0deg); }
        }

        /* 響應式 */
        @media (max-width: 600px) {
            .grid-2, .grid-3, .grid-4, .grid-5 {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .time-slider-group { gap: 5px; }
            .time-chip { padding: 8px 12px; font-size: 0.7rem; }
            .card { padding: 15px; }
            .card-icon { width: 40px; height: 40px; font-size: 1.5rem; }
            .card-title { font-size: 0.9rem; }
            .spider-sprite { width: 50px; height: 75px; }
            .spider-head { width: 35px; height: 25px; left: 8px; }
            .spider-body { width: 30px; height: 35px; top: 24px; left: 10px; }
            .spider-leg { width: 35px; top: 40px; }
            .spider-leg.left { left: -25px; }
            .spider-leg.right { right: -25px; }
            .spider-container { bottom: 15px; right: 15px; }
            .main-container { padding: 15px; }
        }
    </style>
</head>

    <!-- 音效系統 (Web Audio API) -->
    <script>
        // ==================== 音效引擎 ====================
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.initialized = false;
            }
            init() {
                if (this.initialized) return;
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.initialized = true;
                } catch (e) {
                    console.warn('Web Audio API 無法使用');
                }
            }
            play(freq, type, duration, vol = 0.08) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) { /* silent */ }
            }
            click() { this.play(800, 'square', 0.08, 0.06); }
            select() { this.play(600, 'square', 0.1, 0.08); this.play(900, 'square', 0.08, 0.06); }
            confirm() { this.play(400, 'triangle', 0.15, 0.1); this.play(600, 'triangle', 0.12, 0.08); this.play(1000, 'triangle', 0.1, 0.12); }
            scan() { this.play(200, 'sawtooth', 0.3, 0.05); this.play(300, 'sawtooth', 0.25, 0.04); this.play(500, 'sawtooth', 0.2, 0.06); }
            complete() {
                [400, 600, 800, 1000].forEach((f, i) => {
                    setTimeout(() => this.play(f, 'triangle', 0.2, 0.1), i * 80);
                });
            }
        }
        const sound = new SoundEngine();
    </script>

        // ==================== 應用狀態 ====================
        const state = {
            step: 'start',
            mainMuscle: null,
            secondaryMuscle: null,
            time: null,
            environment: null,
            level: null,
        };

        // ==================== 課表生成引擎 ====================
        function generatePlan() {
            const { mainMuscle, secondaryMuscle, time, level } = state;
            let mainCount, secondaryCount;

            const t = parseInt(time);
            if (t <= 30) { mainCount = { main: 1, assist: 1, isolate: 1 }; secondaryCount = 1; }
            else if (t <= 60) { mainCount = { main: 1, assist: 2, isolate: 1 }; secondaryCount = 2; }
            else if (t <= 90) { mainCount = { main: 2, assist: 2, isolate: 2 }; secondaryCount = 3; }
            else if (t <= 120) { mainCount = { main: 2, assist: 3, isolate: 2 }; secondaryCount = 3; }
            else { mainCount = { main: 3, assist: 3, isolate: 3 }; secondaryCount = 4; }

            if (level === 'beginner') {
                mainCount.main = Math.max(1, mainCount.main - 1);
                mainCount.isolate = Math.max(0, mainCount.isolate - 1);
                secondaryCount = Math.max(1, secondaryCount - 1);
            }

            const muscleMap = { 'chest': 'chest', 'back': 'back', 'shoulder': 'shoulder', 'legs': 'legs' };
            const db = exerciseDB[muscleMap[mainMuscle]];

            let mainExercises = [];
            const usedAngles = [];

            const mainPool = [...db.main];
            const pickedMain = pickRandom(mainPool, mainCount.main);
            pickedMain.forEach(e => { mainExercises.push({ ...e, category: '主力' }); usedAngles.push(e.angle); });

            const assistPool = db.assist.filter(e => !usedAngles.includes(e.angle));
            const pickedAssist = pickRandom(assistPool.length > 0 ? assistPool : db.assist, mainCount.assist);
            pickedAssist.forEach(e => { mainExercises.push({ ...e, category: '輔助' }); usedAngles.push(e.angle); });

            const isolatePool = db.isolate.filter(e => !usedAngles.includes(e.angle));
            const pickedIsolate = pickRandom(isolatePool.length > 0 ? isolatePool : db.isolate, mainCount.isolate);
            pickedIsolate.forEach(e => { mainExercises.push({ ...e, category: '孤立' }); });

            let secondaryExercises = [];
            if (secondaryMuscle && secondaryMuscle !== 'none') {
                const secDb = exerciseDB[secondaryMuscle] || [];
                secondaryExercises = pickRandom(secDb, secondaryCount);
            }

            return { main: mainExercises, secondary: secondaryExercises, time: t };
        }

        function pickRandom(arr, count) {
            const shuffled = [...arr].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, Math.min(count, arr.length));
        }

        // ==================== 渲染引擎 ====================
        const app = document.getElementById('appContainer');
        const spiderSprite = document.getElementById('spiderSprite');
        const spiderContainer = document.getElementById('spiderContainer');

            if (type === 'moveLeft') spiderContainer.style.right = '60px';
            if (type === 'moveRight') spiderContainer.style.right = '30px';

                        <button class="btn btn-primary" onclick="generateAndShow()">🔄 重新生成</button>
                        <button class="btn" onclick="resetAll()">🏠 回首頁</button>
                    </div>
                    `;
                    sound.complete();
                    spiderAction('jump');
                    break;
            }

            app.innerHTML = html;
            updateProgress();
        }

        function updateProgress() {
            const steps = ['start', 'target', 'muscle', 'secondary', 'time', 'environment', 'level', 'confirm', 'result'];
            const idx = steps.indexOf(state.step);
            const total = steps.length - 1;
            const pct = Math.round((idx / total) * 100);
            const existingBar = document.querySelector('.progress-bar');
            if (existingBar && state.step !== 'start' && state.step !== 'result') {
                existingBar.querySelector('.progress-fill').style.width = pct + '%';
            }
            if (!existingBar && state.step !== 'start' && state.step !== 'result') {
                const bar = document.createElement('div');
                bar.className = 'progress-bar';
                bar.innerHTML = `<div class="progress-fill" style="width:${pct}%"></div>`;
                app.prepend(bar);
            }
            if (state.step === 'start' || state.step === 'result') {
                const bar = document.querySelector('.progress-bar');
                if (bar) bar.remove();
            }
        }

        // ==================== 互動處理 ====================
        function goTo(step) {
            sound.click();
            renderStep(step);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

            sound.select();
            state.mainMuscle = muscle;
            document.querySelectorAll('[id^="card-"]').forEach(el => el.classList.remove('selected'));
            const card = document.getElementById('card-' + muscle);
            if (card) card.classList.add('selected');
            setTimeout(() => goTo('secondary'), 250);
        }

        function selectSecondary(sec) {

            state.secondaryMuscle = sec;

            state.time = time;
            document.querySelectorAll('.time-chip').forEach(el => el.classList.remove('selected'));

            if (chip) chip.classList.add('selected');
            setTimeout(() => goTo('environment'), 250);

        function selectEnv(env) {
            sound.select();
            state.environment = env;
            document.querySelectorAll('[id^="env-"]').forEach(el => el.classList.remove('selected'));
            const card = document.getElementById('env-' + env);
            if (card) card.classList.add('selected');

        function selectLevel(level) {

            const card = document.getElementById('lvl-' + level);

        function generateAndShow() {
            sound.scan();
            app.innerHTML = `
                <div class="title-section">
                    <span class="spider-icon">🕸️</span>
                    <div style="font-size:1.5rem;color:var(--accent-glow);letter-spacing:4px;">SCAN START</div>
                    <div style="font-size:1rem;color:var(--neon-blue);margin-top:10px;letter-spacing:2px;">
                        ██████████ <span id="scanPct">0</span>%
                    </div>
                    <div style="font-size:0.7rem;color:#555;margin-top:8px;">LOADING...</div>
                </div>
            `;
            spiderAction('swing');
            let pct = 0;
            const interval = setInterval(() => {
                pct += Math.floor(Math.random() * 25) + 5;
                if (pct >= 100) {
                    pct = 100;
                    clearInterval(interval);
                    setTimeout(() => {
                        state.step = 'result';
                        renderStep('result');
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }, 300);
                }
                const el = document.getElementById('scanPct');
                if (el) el.textContent = pct;
            }, 120);
        }

        function resetAll() {
            sound.click();
            state.mainMuscle = null;
            state.secondaryMuscle = null;
            state.time = null;
            state.environment = null;
            state.level = null;
            state.step = 'start';
            renderStep('start');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            spiderContainer.style.right = '30px';
        }

        // ==================== 粒子系統 ====================
        function createParticles() {
            const container = document.getElementById('particlesContainer');
            const colors = ['#7b2fff', '#9b4fff', '#00d4ff', '#ff2d78', '#23d160'];
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = (Math.random() * 3 + 1) + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.animationDuration = (Math.random() * 10 + 8) + 's';
                particle.style.animationDelay = (Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }

        // ==================== 初始化 ====================
        function init() {
            createParticles();
            renderStep('start');
            document.addEventListener('click', () => {
                sound.init();
            }, { once: true });
        }

        init();
    </script>
</body>
</html>
